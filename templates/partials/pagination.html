{% if items.has_other_pages %}<div class="pagination"><span>Page {{ items.number }} of {{ items.paginator.num_pages }}</span><div>{% if items.has_previous %}<a class="btn btn-outline btn-small" href="?page={{ items.previous_page_number }}{% if query %}&q={{ query|urlencode }}{% endif %}{% if status_filter %}&status={{ status_filter }}{% endif %}{% if role_filter %}&role={{ role_filter }}{% endif %}">← Prev</a>{% endif %}{% if items.has_next %}<a class="btn btn-outline btn-small" href="?page={{ items.next_page_number }}{% if query %}&q={{ query|urlencode }}{% endif %}{% if status_filter %}&status={{ status_filter }}{% endif %}{% if role_filter %}&role={{ role_filter }}{% endif %}">Next →</a>{% endif %}</div></div>{% endif %}
